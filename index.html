<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            min-height: 100vh;
        }
        .container { width: 100%; max-width: 480px; text-align: center; }
        .profile-image { width: 96px; height: 96px; border-radius: 50%; object-fit: cover; margin-bottom: 16px; }
        h1 { font-size: 1.25rem; font-weight: 600; margin-bottom: 24px; }
        .section-title { font-size: 0.875rem; text-transform: uppercase; letter-spacing: 0.05em; color: #94a3b8; margin: 24px 0 12px; text-align: left; }
        .link-card {
            display: block;
            background-color: #1e293b;
            color: #f8fafc;
            text-decoration: none;
            padding: 14px 20px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-weight: 500;
            transition: background-color 0.2s ease;
        }
        .link-card:hover { background-color: #334155; }
        footer { margin-top: 40px; padding-top: 20px; border-top: 1px solid #334155; }
        .legal-link { color: #94a3b8; text-decoration: none; font-size: 0.875rem; }
        .legal-link:hover { color: #f8fafc; text-decoration: underline; }
    </style>
</head>
<body>

<div class="container">
    <img src="profile.jpg" alt="Profile picture" class="profile-image">
    <h1>Julius Domroes</h1>

    <div class="section-title">Social Media</div>
    <a href="https://www.youtube.com/@JuliusDomroes" class="link-card" target="_blank" rel="noopener">YouTube</a>
    <a href="https://www.instagram.com/juliusdomroes/" class="link-card" target="_blank" rel="noopener">Instagram</a>
    <a href="https://www.tiktok.com/@juliusdomroes" class="link-card" target="_blank" rel="noopener">TikTok</a>

    <div class="section-title">Deals and Discount Codes</div>
    <a href="https://..." class="link-card" target="_blank" rel="sponsored">Wheelsets</a>

    <footer>
        <a href="impressum.html" class="legal-link">Impressum / Legal Notice</a>
    </footer>
</div>

</body>
</html>
