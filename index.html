<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Redirecting to Julius Domroes' multilingual links page.">
    <title>Redirecting…</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        a {
            color: #38bdf8;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
    <script>
        (function () {
            if (window.location.pathname !== "/" && window.location.pathname !== "/index.html") {
                return;
            }

            var language = (navigator.language || navigator.userLanguage || "de").toLowerCase();
            var target = language.indexOf("de") === 0 ? "/de/" : "/en/";
            window.location.replace(target);
        })();
    </script>
</head>
<body>
    <p>Redirecting…</p>
</body>
</html>
